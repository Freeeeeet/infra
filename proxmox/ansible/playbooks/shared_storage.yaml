---
- name: Создание медиа хранилища /shared_data
  hosts: proxmox
  become: true

  vars:
    vg_name: pve
    thinpool: data
    lv_name: media
    lv_size: 300g
    mount_point: /shared_data
    fs_type: ext4
    media_gid: 101000

  tasks:
    - name: Создание thin тома в пуле
      community.general.lvol:
        vg: "{{ vg_name }}"
        lv: "{{ lv_name }}"
        size: "{{ lv_size }}"
        thinpool: "{{ thinpool }}"
        state: present

    - name: Создание файловой системы на томе
      community.general.filesystem:
        fstype: "{{ fs_type }}"
        dev: "/dev/{{ vg_name }}/{{ lv_name }}"

    - name: Монтирование тома и запись в fstab
      ansible.posix.mount:
        path: "{{ mount_point }}"
        src: "/dev/{{ vg_name }}/{{ lv_name }}"
        fstype: "{{ fs_type }}"
        state: mounted

    - name: Создание дерева директорий с нужными правами
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: "{{ media_gid }}"
        mode: "2775"
      loop:
        - "{{ mount_point }}/media"
        - "{{ mount_point }}/media/movies"
        - "{{ mount_point }}/media/tv"
        - "{{ mount_point }}/media/music"
        - "{{ mount_point }}/downloads"
        - "{{ mount_point }}/downloads/complete"
        - "{{ mount_point }}/downloads/incomplete"
