---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: sonarr
  namespace: jellyfin

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: sonarr

  template:
    metadata:
      labels:
        app: sonarr

    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-worker-1

      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch

      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:latest

          env:
            - name: PUID
              value: "2000"

            - name: PGID
              value: "2000"

            - name: TZ
              value: Europe/Moscow

            - name: UMASK
              value: "002"

          ports:
            - name: http
              containerPort: 8989
              protocol: TCP

          volumeMounts:
            - name: config
              mountPath: /config

            - name: media
              mountPath: /data

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config

        - name: media
          persistentVolumeClaim:
            claimName: media
