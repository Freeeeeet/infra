---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: jellyfin
  namespace: jellyfin

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: jellyfin

  template:
    metadata:
      labels:
        app: jellyfin

    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-worker-1

      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch

      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:latest

          ports:
            - name: http
              containerPort: 8096
              protocol: TCP

          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: media
          persistentVolumeClaim:
            claimName: media
