---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: prowlarr
  namespace: jellyfin

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: prowlarr

  template:
    metadata:
      labels:
        app: prowlarr

    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-worker-1

      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:latest

          env:
            - name: PUID
              value: "2000"

            - name: PGID
              value: "2000"

            - name: TZ
              value: Europe/Moscow

            - name: UMASK
              value: "002"

          ports:
            - name: http
              containerPort: 9696
              protocol: TCP

          volumeMounts:
            - name: config
              mountPath: /config

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
